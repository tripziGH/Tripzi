<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tripzi - Flight Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 24px;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #2563eb;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 50px 20px 80px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 38px;
    }

    .hero p {
      margin: 0;
      font-size: 17px;
      opacity: 0.95;
    }

    .search-box {
      max-width: 1050px;
      margin: -45px auto 30px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      position: relative;
    }

    .trip-type {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 0.7fr auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 14px 22px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .results {
      max-width: 1050px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }

    .message {
      text-align: center;
      padding: 25px;
      color: #4b5563;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .flight-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .flight-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .route {
      font-size: 20px;
      font-weight: 800;
    }

    .price {
      font-size: 22px;
      font-weight: 800;
      color: #2563eb;
    }

    .details {
      margin-top: 12px;
      color: #6b7280;
      font-size: 14px;
    }

    .select-flight {
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .fields {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 30px;
      }

      .search-box {
        margin: -35px 12px 25px;
        padding: 18px;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .flight-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Tripzi</div>
  </header>

  <section class="hero">
    <h1>Find Your Next Flight</h1>
    <p>Search flights and discover your next destination with Tripzi.</p>
  </section>

  <main>

    <section class="search-box">

      <div class="trip-type">
        <label>
          <input type="radio" name="tripType" value="round" checked>
          Round trip
        </label>

        <label>
          <input type="radio" name="tripType" value="oneway">
          One way
        </label>
      </div>

      <div class="fields">

        <div>
          <label for="from">From</label>
          <input
            id="from"
            type="text"
            placeholder="DVO"
            maxlength="3"
            value="DVO"
          >
        </div>

        <div>
          <label for="to">To</label>
          <input
            id="to"
            type="text"
            placeholder="MNL"
            maxlength="3"
            value="MNL"
          >
        </div>

        <div>
          <label for="departure">Departure</label>
          <input id="departure" type="date">
        </div>

        <div>
          <label for="return">Return</label>
          <input id="return" type="date">
        </div>

        <div>
          <label for="passengers">Passengers</label>
          <select id="passengers">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
          </select>
        </div>

        <button id="searchButton" onclick="searchFlights()">
          Search Flights
        </button>

      </div>

    </section>

    <section class="results" id="results">
      <div class="message">
        Enter your travel details and search for flights.
      </div>
    </section>

  </main>

  <footer>
    © 2026 Tripzi. All rights reserved.
  </footer>


  <script>

    // Set today's date automatically
    const today = new Date().toISOString().split("T")[0];

    document.getElementById("departure").min = today;
    document.getElementById("return").min = today;


    // Keep return date after departure date
    document.getElementById("departure").addEventListener("change", function () {
      document.getElementById("return").min = this.value;
    });


    // Search flights
    async function searchFlights() {

      const from =
        document.getElementById("from").value.trim().toUpperCase();

      const to =
        document.getElementById("to").value.trim().toUpperCase();

      const departure =
        document.getElementById("departure").value;

      const returnDate =
        document.getElementById("return").value;

      const passengers =
        Number(document.getElementById("passengers").value);

      const tripType =
        document.querySelector('input[name="tripType"]:checked').value;

      const results =
        document.getElementById("results");

      const button =
        document.getElementById("searchButton");


      // Validation
      if (!from || !to) {
        results.innerHTML =
          '<div class="error">Please enter both departure and destination airports.</div>';
        return;
      }

      if (from.length !== 3 || to.length !== 3) {
        results.innerHTML =
          '<div class="error">Please use valid 3-letter airport codes, such as DVO and MNL.</div>';
        return;
      }

      if (!departure) {
        results.innerHTML =
          '<div class="error">Please select a departure date.</div>';
        return;
      }

      if (tripType === "round" && !returnDate) {
        results.innerHTML =
          '<div class="error">Please select a return date.</div>';
        return;
      }


      // Loading state
      button.disabled = true;
      button.textContent = "Searching...";

      results.innerHTML = `
        <div class="message">
          Searching flights from <strong>${from}</strong>
          to <strong>${to}</strong>...
        </div>
      `;


      try {

        const response = await fetch("/api/search", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            from: from,

            to: to,

            departure: departure,

            returnDate:
              tripType === "round"
                ? returnDate
                : null,

            passengers: passengers

          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to search for flights."
          );

        }


        displayFlights(data);


      } catch (error) {

        console.error(error);

        results.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;

      } finally {

        button.disabled = false;
        button.textContent = "Search Flights";

      }

    }


    // Display results
    function displayFlights(data) {

      const results =
        document.getElementById("results");


      const flights =
        data.data ||
        data.offers ||
        data.flights ||
        [];


      if (!Array.isArray(flights) || flights.length === 0) {

        results.innerHTML = `
          <div class="message">
            <h3>No flights found</h3>
            <p>Try another date or route.</p>
          </div>
        `;

        return;

      }


      results.innerHTML =
        `<h2>${flights.length} flight option(s)</h2>`;


      flights.forEach((flight, index) => {

        const price =
          flight.total_amount
            ? `${flight.total_currency || ""} ${flight.total_amount}`
            : flight.price
              ? `${flight.price}`
              : "Price unavailable";


        let routeText =
          "Flight option " + (index + 1);


        let details =
          "";


        try {

          const slices =
            flight.slices || [];

          if (slices.length > 0) {

            const segments =
              slices[0].segments || [];

            if (segments.length > 0) {

              const first =
                segments[0];

              const last =
                segments[segments.length - 1];


              routeText =
                `${first.origin?.iata_code || fromCode(flight)}
                → 
                ${last.destination?.iata_code || ""}`;


              details =
                `${segments.length} segment(s)`;

            }

          }

        } catch (e) {

          console.log("Flight display detail unavailable.");

        }


        const card =
          document.createElement("div");

        card.className =
          "flight-card";


        card.innerHTML = `

          <div class="flight-top">

            <div>

              <div class="route">
                ${escapeHtml(routeText)}
              </div>

              <div class="details">
                ${escapeHtml(details)}
              </div>

            </div>

            <div class="price">
              ${escapeHtml(price)}
            </div>

          </div>

          <button class="select-flight"
                  onclick="selectFlight(${index})">
            Select Flight
          </button>

        `;


        results.appendChild(card);

      });

    }


    function selectFlight(index) {

      alert(
        "Flight " +
        (index + 1) +
        " selected."
      );

    }


    function fromCode(flight) {

      try {

        return flight.slices?.[0]
          ?.segments?.[0]
          ?.origin?.iata_code || "";

      } catch {

        return "";

      }

    }


    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
  </html>
